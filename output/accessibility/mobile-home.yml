        - generic [ref=f4e102] [box=20,2600,350,807]:
          - generic [ref=f4e103] [box=20,2600,350,118]:
            - heading "Can anyone read a public case?" [level=3] [ref=f4e104] [box=20,2600,350,21]
            - paragraph [ref=f4e105] [box=20,2627,350,70]: Yes. Public cases are designed to be opened and shared by anyone. You only need to sign in when you want to vote or file a case.
          - generic [ref=f4e106] [box=20,2738,350,118]:
            - heading "How is the verdict decided?" [level=3] [ref=f4e107] [box=20,2738,350,21]
            - paragraph [ref=f4e108] [box=20,2765,350,70]: The verdict is based on the stored for and against vote totals. There is no hidden consensus score.
          - generic [ref=f4e109] [box=20,2875,350,118]:
            - heading "Do I need a password?" [level=3] [ref=f4e110] [box=20,2875,350,21]
            - paragraph [ref=f4e111] [box=20,2902,350,70]: No. Internet Court uses Google sign in, so you can enter without creating or remembering another password.
          - generic [ref=f4e112] [box=20,3013,350,118]:
            - heading "Can I report a case?" [level=3] [ref=f4e113] [box=20,3013,350,21]
            - paragraph [ref=f4e114] [box=20,3040,350,70]: Yes. Every public case has a reporting path for abuse such as harassment, threats, personal data, hate and spam.
          - generic [ref=f4e115] [box=20,3151,350,118]:
            - heading "Is filing a case free?" [level=3] [ref=f4e116] [box=20,3151,350,21]
            - paragraph [ref=f4e117] [box=20,3178,350,70]: Public cases are free to file. Membership is for people who want more control over their cases and identity.
          - generic [ref=f4e118] [box=20,3289,350,118]:
            - heading "Does Internet Court use fake votes?" [level=3] [ref=f4e119] [box=20,3289,350,21]
            - paragraph [ref=f4e120] [box=20,3316,350,70]: No. The product is built around real authenticated votes and server side checks. Nothing is seeded.
