        - generic [ref=f2e102] [box=224,1899,720,621]:
          - generic [ref=f2e103] [box=224,1899,720,95]:
            - heading "Can anyone read a public case?" [level=3] [ref=f2e104] [box=224,1899,720,21]
            - paragraph [ref=f2e105] [box=224,1926,720,47]: Yes. Public cases are designed to be opened and shared by anyone. You only need to sign in when you want to vote or file a case.
          - generic [ref=f2e106] [box=224,2014,720,71]:
            - heading "How is the verdict decided?" [level=3] [ref=f2e107] [box=224,2014,720,21]
            - paragraph [ref=f2e108] [box=224,2041,720,23]: The verdict is based on the stored for and against vote totals. There is no hidden consensus score.
          - generic [ref=f2e109] [box=224,2105,720,95]:
            - heading "Do I need a password?" [level=3] [ref=f2e110] [box=224,2105,720,21]
            - paragraph [ref=f2e111] [box=224,2132,720,47]: No. Internet Court uses Google sign in, so you can enter without creating or remembering another password.
          - generic [ref=f2e112] [box=224,2220,720,95]:
            - heading "Can I report a case?" [level=3] [ref=f2e113] [box=224,2220,720,21]
            - paragraph [ref=f2e114] [box=224,2247,720,47]: Yes. Every public case has a reporting path for abuse such as harassment, threats, personal data, hate and spam.
          - generic [ref=f2e115] [box=224,2334,720,95]:
            - heading "Is filing a case free?" [level=3] [ref=f2e116] [box=224,2334,720,21]
            - paragraph [ref=f2e117] [box=224,2361,720,47]: Public cases are free to file. Membership is for people who want more control over their cases and identity.
          - generic [ref=f2e118] [box=224,2449,720,71]:
            - heading "Does Internet Court use fake votes?" [level=3] [ref=f2e119] [box=224,2449,720,21]
            - paragraph [ref=f2e120] [box=224,2476,720,23]: No. The product is built around real authenticated votes and server side checks. Nothing is seeded.
