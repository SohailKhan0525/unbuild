name: Publish
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install dependencies
        run: npm install

      - name: Verify npm CLI supports trusted publishing
        run: |
          set -euxo pipefail
          npm install --global npm@11.15.0
          node --version
          export NPM_VERSION="$(npm --version)"
          echo "npm=$NPM_VERSION"
          node -e "const [major, minor, patch] = process.env.NPM_VERSION.split('.').map(Number); if (major < 11 || (major === 11 && (minor < 15 || (minor === 15 && patch < 0)))) process.exit(1)"

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Check
        run: npm run check

      - name: Test
        run: npm test

      - name: Audit dependencies
        run: npm run audit

      - name: Bootstrap initial published version tag
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin refs/tags/v1.0.0 >/dev/null 2>&1; then
            echo "v1.0.0 already exists"
            exit 0
          fi
          echo "Creating v1.0.0 because the initial package version was published manually."
          git tag -a v1.0.0 -m "chore(release): v1.0.0"
          git push origin v1.0.0

      - name: Publish npm package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
