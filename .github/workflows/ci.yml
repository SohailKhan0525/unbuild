name: CI
on:
  push:
    branches: ["**"]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ["22", "24"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm test


  live-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Unbuild Motion live site
        run: |
          set -euxo pipefail
          rm -rf ./motion-smoke
          node dist/cli.js http://motion.dev/ --output ./motion-smoke --pages 1 --timeout 45000
          test -s ./motion-smoke/AI.md
          test -s ./motion-smoke/DESIGN.md
          test -s ./motion-smoke/evidence/all-pages.json
          test -s ./motion-smoke/assets/manifest.json
          test -s ./motion-smoke/motion/summary.json
          test -s ./motion-smoke/ux/interaction-states.json
          test -s ./motion-smoke/styles/inventory.json
          test -s ./motion-smoke/accessibility/summary.json
          test "$(find ./motion-smoke/accessibility -type f -name 'axe-*.json' | wc -l)" -gt 0
          test -s ./motion-smoke/accessibility/desktop-home.yml
          test -s ./motion-smoke/responsive/desktop-home.json
          test -s ./motion-smoke/screenshots/desktop/home.png
          find ./motion-smoke/assets -type f -print

  published-npm-motion:
    needs: live-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Wait for published npm version to match latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          for i in $(seq 1 40); do
            release_tag="$(gh release view --repo "${{ github.repository }}" --json tagName --jq '.tagName' 2>/dev/null || true)"
            npm_version="$(npm view @agent-qofeno/unbuild version 2>/dev/null || true)"
            echo "release=${release_tag:-unknown} npm=${npm_version:-unknown}"
            if [ -n "$release_tag" ] && [ "${release_tag#v}" = "$npm_version" ]; then
              exit 0
            fi
            sleep 15
          done
          echo "Published npm package did not converge on the latest GitHub release."
          exit 1
      - name: Install Chromium
        run: sudo apt-get update && sudo apt-get install -y chromium
      - name: Run exact published npx command
        run: |
          set -euxo pipefail
          rm -rf /tmp/unbuild-published-motion
          mkdir -p /tmp/unbuild-published-motion
          cd /tmp/unbuild-published-motion
          npm init -y
          npx @agent-qofeno/unbuild http://motion.dev/
      - name: Verify published Motion output
        run: |
          set -euxo pipefail
          cd /tmp/unbuild-published-motion/unbuild-output
          test -s AI.md
          test -s DESIGN.md
          test -s evidence/all-pages.json
          test -s assets/manifest.json
          test -s motion/summary.json
          test -s styles/inventory.json
          test -s accessibility/summary.json
          test "$(find accessibility -type f -name 'axe-*.json' | wc -l)" -gt 0
          test -s ux/summary.json
          test "$(find accessibility -type f -name '*.yml' | wc -l)" -gt 0
          test "$(find screenshots/desktop -type f | wc -l)" -gt 0
          test "$(find responsive -type f -name '*.json' | wc -l)" -gt 0
          test -d assets/images
          test -d assets/icons
          test -d assets/fonts
          test -d assets/styles
          test -d assets/media
          find . -type f -print | sort
