name: Published npm Motion smoke

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  motion:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check published package
        shell: bash
        run: |
          set -euxo pipefail
          npm view @agent-qofeno/unbuild version
          npm pack @agent-qofeno/unbuild --dry-run

      - name: Install Chromium
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y chromium

      - name: Run exact published npx command
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/unbuild-npm-motion
          cd /tmp/unbuild-npm-motion
          npm init -y
          npx @agent-qofeno/unbuild http://motion.dev/

      - name: Verify Motion output
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/unbuild-npm-motion/unbuild-output
          test -s AI.md
          test -s DESIGN.md
          test -s evidence/all-pages.json
          test -s assets/manifest.json
          test -s motion/summary.json
          test -s ux/summary.json
          test "$(find accessibility -type f -name '*.yml' | wc -l)" -gt 0
          test "$(find screenshots/desktop -type f | wc -l)" -gt 0
          test "$(find responsive -type f -name '*.json' | wc -l)" -gt 0
          test -d assets/images
          test -d assets/icons
          test -d assets/fonts
          test -d assets/styles
          test -d assets/media
          find . -type f -print | sort
          du -sh .
