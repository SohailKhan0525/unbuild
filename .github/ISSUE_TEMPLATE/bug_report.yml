name: Bug report
description: Report a reproducible problem with unbuild
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues before opening a new report.

  - type: input
    id: version
    attributes:
      label: unbuild version
      placeholder: "1.0.0"
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: "22.14.0"
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: Command
      description: Remove credentials, cookies, tokens, and private URLs.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
